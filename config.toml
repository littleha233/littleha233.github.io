baseURL = "https://littleha233.github.io/"
languageCode = "zh-cn"
title = "Nicola Von | Engineering Notes"
defaultContentLanguage = "zh"
hasCJKLanguage = true
summaryLength = 100

enableRobotsTXT = true
enableEmoji = false

[params]
  author = "Nicola Von"
  description = "记录钱包工程、区块链协议、系统与安全的实践与思考。"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  defaultTheme = "auto"

  [params.homeInfoParams]
    Title = "Hi, I'm Nicola 👋"
    Content = "Wallet Engineering · Blockchain · Security · Systems"

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2

[outputs]
  home = ["HTML", "RSS", "JSON"]
[taxonomies]
  tag = "tags"
  category = "categories"
[markup.highlight]
  style = "github-dark"
  lineNos = false
[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
