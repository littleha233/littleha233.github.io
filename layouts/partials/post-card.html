<article class="post-card"><div class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>{{ range .Params.categories }}<span>{{ . }}</span>{{ end }}<span>{{ .ReadingTime }} 分钟阅读</span></div><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Description | default (.Summary | plainify) }}</p><div class="card-bottom"><div class="tags">{{ range .GetTerms "tags" }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</div><a class="read-arrow" aria-label="阅读 {{ .Title }}" href="{{ .RelPermalink }}">↗</a></div></article>
